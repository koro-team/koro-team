<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --yellow:#F7B500;
  --yellow-dark:#D89A00;
  --black:#0c0c0c;
  --charcoal:#161616;
  --card:#1b1b1b;
  --card-line:#2c2c2c;
  --white:#f5f5f3;
  --muted:#9a9a94;
  --danger:#e2483a;
  --good:#5cb85c;
  --blue:#5b9bd5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--black);color:var(--white);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,h4,.brand-font{font-family:'Archivo Black',sans-serif;letter-spacing:0.5px;}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
input,textarea,select{font-family:'Inter',sans-serif;}
::selection{background:var(--yellow);color:var(--black);}

.bolt-icon{width:22px;height:34px;flex-shrink:0;}
.bolt-divider{width:100%;height:14px;background:var(--yellow);clip-path:polygon(0% 0%, 55% 0%, 40% 50%, 60% 50%, 45% 100%, 0% 100%);opacity:.9;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--charcoal);border-bottom:3px solid var(--yellow);position:sticky;top:0;z-index:20;}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-text{font-size:20px;color:var(--white);}
.logo-text span{color:var(--yellow);}
.user-chip{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.role-badge{background:var(--yellow);color:var(--black);font-weight:800;font-size:10px;padding:3px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:0.5px;}
.logout-btn{background:transparent;color:var(--muted);border:1px solid var(--card-line);padding:6px 12px;border-radius:4px;font-size:12px;font-weight:600;}
.logout-btn:hover{border-color:var(--yellow);color:var(--yellow);}

.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
.auth-wrap::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle, rgba(247,181,0,0.08) 0%, transparent 70%);top:-100px;right:-150px;}
.auth-card{background:var(--charcoal);border:1px solid var(--card-line);border-radius:6px;padding:36px 32px;width:100%;max-width:380px;position:relative;z-index:1;}
.auth-logo{text-align:center;margin-bottom:22px;}
.auth-logo .logo-text{font-size:26px;display:block;}
.auth-logo .tagline{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input,.field textarea,.field select{width:100%;background:var(--black);border:1px solid var(--card-line);color:var(--white);padding:10px 12px;border-radius:4px;font-size:14px;}

<script>
/* ===================== FIREBASE ===================== */
/* PASO OBLIGATORIO: reemplazá estos valores por los de TU propio proyecto de Firebase
   (Configuración del proyecto → Tus apps → SDK setup and configuration → Config).
   Sin esto la app no va a poder guardar ni leer nada. */
const firebaseConfig = {
  apiKey: "AIzaSyC1EMn2fLd6ElqNaib6GUs9M8vnr3qss6A",
  authDomain: "koro-team.firebaseapp.com",
  projectId: "koro-team",
  storageBucket: "koro-team.firebasestorage.app",
  messagingSenderId: "392500187007",
  appId: "1:392500187007:web:29e1a798a27f7902e9544a",
  measurementId: "G-1R5LS6N6X9"
};
firebase.initializeApp(firebaseConfig);
const firestore = firebase.firestore();
const FIRESTORE_COLLECTION = 'koro';
const FIRESTORE_DOC = 'data';

/* ===================== STORAGE HELPERS ===================== */
let db = { users:{}, workouts:{}, races:{}, logs:{}, templates:{}, templateFolders:{}, messages:{}, infoPosts:{}, paymentPlans:{}, payments:{}, annotations:{} };
let dbLoaded = false;

const DB_COLLECTIONS = ['users','workouts','races','logs','templates','templateFolders','messages','infoPosts','paymentPlans','payments','annotations'];

/* Cuando alguien borra algo (un usuario, una planificación, etc.), el merge de saveDB()
   podría "resucitarlo" si otra persona todavía tiene esa entidad en su copia remota
   (porque el merge es una unión de claves). Para evitar eso, llevamos un registro de
   qué se borró en esta sesión y, después de mezclar, lo volvemos a quitar. */
let pendingDeletions = { users:[], workouts:[], races:[], logs:[], templates:[], templateFolders:[], messages:[], infoPosts:[], paymentPlans:[], payments:[], annotations:[] };
function removeEntity(collection, id){
  delete db[collection][id];
  pendingDeletions[collection].push(id);
}

let dbLoadFailed = false;

async function loadDB(){
  let readOk = false;
  try{
    const docSnap = await firestore.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC).get();
    readOk = true;
    if(docSnap.exists && docSnap.data() && docSnap.data().payload){ db = JSON.parse(docSnap.data().payload); }
  }catch(e){
    console.error('No se pudo leer de Firestore (revisá firebaseConfig y las reglas de seguridad)', e);
  }
  if(!readOk){
    // No pudimos confirmar qué hay realmente guardado en Firestore (problema de red, de
    // reglas de seguridad, etc.). NUNCA hay que asumir en este caso que "no hay datos" y
    // arrancar de cero, porque si después se guarda algo se podría borrar por completo
    // la base real. Mostramos un aviso y no dejamos avanzar hasta poder confirmar.
    dbLoadFailed = true;
    dbLoaded = true;
    return;
  }
  if(!db.users) db.users = {};
  if(!db.workouts) db.workouts = {};
  if(!db.races) db.races = {};
  if(!db.logs) db.logs = {};
  if(!db.templates) db.templates = {};
  if(!db.templateFolders) db.templateFolders = {};
  if(!db.messages) db.messages = {};
  if(!db.infoPosts) db.infoPosts = {};
  if(!db.paymentPlans) db.paymentPlans = {};
  if(!db.payments) db.payments = {};
  if(!db.annotations) db.annotations = {};
  if(Object.keys(db.users).length === 0){
    // Esto solo puede pasar si la lectura tuvo éxito (readOk=true) y el documento
    // realmente no tiene usuarios todavía -- es decir, una instalación genuinamente nueva.
    db.users['admin'] = {password:'koro2026', role:'admin', status:'active', name:'Administrador', createdAt:Date.now()};
    await saveDB();
  }
  dbLoaded = true;
}

async function saveDB(){
  // Antes de guardar, traemos la última versión guardada por CUALQUIER otra persona
  // y la combinamos con nuestros cambios locales, en vez de pisarla entera. Así, si
  // dos personas hicieron cosas distintas casi al mismo tiempo (por ejemplo una se
  // registra mientras otra aprueba a alguien), ninguna de las dos acciones se pierde.
  // IMPORTANTE: si esta lectura previa falla, ABORTAMOS el guardado por completo -- no
  // hay que arriesgarse nunca a pisar Firestore con una copia local que podría estar
  // incompleta respecto de lo que hay guardado de verdad.
  let remote = null;
  let readOk = false;
  try{
    const docSnap = await firestore.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC).get();
    readOk = true;
    if(docSnap.exists && docSnap.data() && docSnap.data().payload){ remote = JSON.parse(docSnap.data().payload); }
  }catch(e){ console.error('No se pudo leer de Firestore antes de guardar', e); }

  if(!readOk){
    alert('No se pudo conectar con la base de datos para guardar este cambio. Probá de nuevo en unos segundos (revisá tu conexión a internet). El cambio NO se guardó todavía, para evitar el riesgo de borrar datos por accidente.');
    return;
  }

  if(remote){
    const merged = {};
    DB_COLLECTIONS.forEach(key=>{
      merged[key] = Object.assign({}, remote[key]||{}, db[key]||{});
      (pendingDeletions[key]||[]).forEach(id=>{ delete merged[key][id]; });
    });
    db = merged;
  }

  try{
    await firestore.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC).set({ payload: JSON.stringify(db) });
    DB_COLLECTIONS.forEach(key=>{ pendingDeletions[key] = []; });
  }catch(e){
    console.error('No se pudo guardar en Firestore (revisá firebaseConfig y las reglas de seguridad)', e);
    alert('No se pudo guardar este cambio en la base de datos. Probá de nuevo en unos segundos.');
  }
}

/* ===================== CALENDAR HELPERS ===================== */
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function dateStr(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayStr(){ const t=new Date(); return dateStr(t.getFullYear(), t.getMonth(), t.getDate()); }
function currentMonthStr(){ const t=new Date(); return `${t.getFullYear()}-${pad2(t.getMonth()+1)}`; }
const MONTH_NAMES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function formatMonthYearLabel(monthStr){
  if(!monthStr) return '';
  const [y,m] = monthStr.split('-').map(Number);
  if(!y || !m) return monthStr;
  return `${MONTH_NAMES[m-1]} ${y}`;
}
function monthLabel(y,m){ return `${MONTH_NAMES[m]} ${y}`; }
function buildCalendarCells(y,m){
  const first = new Date(y,m,1);
  let startDay = first.getDay();
  startDay = (startDay+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(dateStr(y,m,d));
  while(cells.length%7!==0) cells.push(null);
  return cells;
}
function formatDateLong(dstr){
  if(!dstr) return '';
  const [y,m,d] = dstr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  return dt.toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function renderMonthCalendar(markedDates){
  const cells = buildCalendarCells(S.calYear, S.calMonth);
  const weekdays=['L','M','X','J','V','S','D'];
  const today = todayStr();
  return `<div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav-btn" data-cal-prev>‹</button>
      <div class="cal-month-label">${monthLabel(S.calYear,S.calMonth)}</div>
      <button class="cal-nav-btn" data-cal-next>›</button>
    </div>
    <div class="cal-grid">
      ${weekdays.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}
      ${cells.map(c=>{
        if(!c) return `<div class="cal-cell empty"></div>`;
        const day = parseInt(c.split('-')[2],10);
        const cls = ['cal-cell'];
        if(c===today) cls.push('cal-today');
        if(c===S.calSelectedDate) cls.push('cal-selected');
        return `<div class="${cls.join(' ')}" data-cal-day="${c}">${day}${markedDates.has(c)?'<span class="cal-dot"></span>':''}</div>`;
      }).join('')}
    </div>
  </div>`;
}

function normalizeHeader(h){
  return (h||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
}
function getField(row, ...names){
  for(const key in row){
    if(names.includes(normalizeHeader(key))) return (row[key]!==undefined && row[key]!==null) ? row[key] : '';
  }
  return '';
}
function toTitleCase(s){
  return s.toString().toLowerCase().split(' ').map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(' ');
}
/* Busca la fila que realmente tiene los encabezados de la tabla (algunas planillas
   traen datos generales del alumno arriba, como Alumno/Objetivo/Fecha de inicio,
   antes de la tabla en sí) y arma los objetos de fila a partir de ahí. */
function sheetToRowsSmartHeader(sheet, keywords){
  const raw = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  let headerIdx = 0;
  for(let i=0;i<raw.length;i++){
    const normalized = (raw[i]||[]).map(c=>normalizeHeader(c));
    if(keywords.some(k=>normalized.includes(k))){ headerIdx = i; break; }
  }
  const headers = raw[headerIdx] || [];
  const rows = [];
  for(let i=headerIdx+1;i<raw.length;i++){
    const rowArr = raw[i];
    if(!rowArr || rowArr.every(c=>c===''||c===undefined||c===null)) continue;
    const obj = {};
    headers.forEach((h,idx)=>{ if(h) obj[h] = rowArr[idx]!==undefined ? rowArr[idx] : ''; });
    rows.push(obj);
  }
  return rows;
}
/* Interpreta la columna TRABAJO PRINCIPAL: FONDO..., pasadas simples "5X1000",
   o piramidales "4X250 + 2X500 + 1000 + 2X500 + 4X250" (cada "+" es un bloque,
   un número solo como "1000" implica 1 repetición). Si no reconoce el patrón,
   lo deja como trabajo libre ("otro"). */
function parseTrabajoPrincipal(text, pausasText){
  text = (text||'').toString().trim();
  if(!text) return {mainType:'otro', otroDetail:'', fondoDetail:'', pasadasBlocks:[]};
  if(text.toUpperCase().startsWith('FONDO')){
    const detail = text.replace(/^FONDO\s*/i,'').trim();
    return {mainType:'fondo', fondoDetail: detail || text, otroDetail:'', pasadasBlocks:[]};
  }
  const segments = text.split('+').map(s=>s.trim()).filter(Boolean);
  const blockRegex = /^(\d+)\s*[xX]\s*(.+)$/;
  const plainNumRegex = /^\d+[a-zA-Z]*$/;
  let allMatch = segments.length>0;
  const blocks = [];
  segments.forEach(seg=>{
    const m = seg.match(blockRegex);
    if(m){
      blocks.push({reps:m[1].trim(), dist:m[2].trim(), pause:''});
    } else if(plainNumRegex.test(seg.replace(/\s+/g,''))){
      blocks.push({reps:'1', dist:seg.trim(), pause:''});
    } else {
      allMatch = false;
    }
  });
  if(allMatch && blocks.length>0){
    const pauseSegs = (pausasText||'').toString().split('+').map(s=>s.trim()).filter(Boolean);
    blocks.forEach((b,i)=>{ b.pause = pauseSegs[i] || ''; });
    return {mainType:'pasadas', pasadasBlocks:blocks, fondoDetail:'', otroDetail:''};
  }
  return {mainType:'otro', otroDetail:text, fondoDetail:'', pasadasBlocks:[], extraPause: pausasText||''};
}
/* Convierte las filas crudas leídas de la planilla (sheet_to_json) en objetos
   de planificación, arrastrando el PERÍODO hacia abajo cuando viene vacío. */
/* Interpreta un valor de fecha que puede venir como objeto Date (celda con formato fecha
   real en Excel) o como texto en formato DD/MM/AAAA o AAAA-MM-DD. Devuelve 'AAAA-MM-DD'
   o '' si no se pudo interpretar. */
function parseExcelDateValue(v){
  if(v===undefined || v===null || v==='') return '';
  if(v instanceof Date && !isNaN(v)) return dateStr(v.getFullYear(), v.getMonth(), v.getDate());
  const s = v.toString().trim();
  if(!s) return '';
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return dateStr(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10));
  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m) return dateStr(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  return '';
}
function parseImportRows(rawRows){
  const results = [];
  let lastPeriodo = '';
  rawRows.forEach(row=>{
    const periodoRaw = getField(row,'PERIODO').toString().trim();
    if(periodoRaw) lastPeriodo = periodoRaw;
    const dia = getField(row,'DIA').toString().trim();
    const warmup = getField(row,'ENTRADA EN CALOR').toString().trim();
    const trabajo = getField(row,'TRABAJO PRINCIPAL').toString().trim();
    const pausas = getField(row,'TIEMPOS DE PAUSAS').toString().trim();
    const cooldown = getField(row,'VUELTA A LA CALMA').toString().trim();
    const calendarDateRaw = getField(row,'DIA (CALENDARIO)','FECHA CALENDARIO','FECHA');
    const calendarDate = parseExcelDateValue(calendarDateRaw);
    if(!dia && !warmup && !trabajo && !cooldown) return;
    const parsedMain = parseTrabajoPrincipal(trabajo, pausas);
    let description = lastPeriodo ? `${toTitleCase(lastPeriodo)}.` : '';
    if(parsedMain.mainType==='otro' && parsedMain.extraPause){
      description += (description?' ':'') + `Pausa: ${parsedMain.extraPause}`;
    }
    results.push({
      title: dia ? toTitleCase(dia) : 'Entrenamiento importado',
      warmup, cooldown,
      mainType: parsedMain.mainType,
      pasadasBlocks: parsedMain.pasadasBlocks || [],
      fondoDetail: parsedMain.fondoDetail || '',
      otroDetail: parsedMain.otroDetail || '',
      description: description.trim(),
      calendarDate
    });
  });
  return results;
}

/* Interpreta una planilla de MUSCULACIÓN: cada fila es un ejercicio con su Día y Grupo
   Muscular. Se agrupan por (Día + Grupo Muscular) -- cada combinación se convierte en
   una planificación separada, con cada ejercicio como un bloque dentro de ella. Las
   columnas de seguimiento semana a semana (kg/reps) se ignoran a propósito: eso lo
   carga después cada alumno como "Pesos y repeticiones" al registrar el entrenamiento. */
/* DÍA se mantiene (arrastrado) hasta que aparece otro -- cada día es una planificación.
   Dentro de ese día, GRUPO MUSCULAR también se mantiene hasta que cambia: cada ejercicio
   se etiqueta con el grupo muscular vigente, así que un mismo día puede tener varios
   grupos musculares (cada uno con sus propios ejercicios) sin que eso abra una nueva
   planificación -- solo cambiar el DÍA abre una nueva. */
function parseMusculacionImportRows(rawRows){
  const days = [];
  let currentDay = null;
  let currentGroup = '';
  rawRows.forEach(row=>{
    const dayVal = getField(row,'DIA').toString().trim();
    const groupVal = getField(row,'GRUPO MUSCULAR').toString().trim();
    const exercise = getField(row,'EJERCICIO').toString().trim();
    if(!dayVal && !groupVal && !exercise) return;

    if(dayVal){
      currentDay = {day:dayVal, exercises:[]};
      days.push(currentDay);
      currentGroup = '';
    }
    if(!currentDay) return;
    if(groupVal) currentGroup = groupVal;
    if(!exercise) return;

    const series = getField(row,'SERIES').toString().trim();
    const reps = getField(row,'REPS OBJETIVO','REPS').toString().trim();
    const peso = getField(row,'OBJETIVO PESO KG','PESO OBJETIVO KG','PESO KG','OBJETIVO PESO').toString().trim();
    const tempo = getField(row,'TEMPO').toString().trim();
    const descanso = getField(row,'DESCANSO').toString().trim();
    const aclaraciones = getField(row,'ACLARACIONES').toString().trim();

    const notesParts = [];
    if(peso) notesParts.push(`Peso objetivo: ${peso}`);
    if(tempo) notesParts.push(`Tempo: ${tempo}`);
    if(aclaraciones) notesParts.push(aclaraciones);

    currentDay.exercises.push({
      muscleGroup: currentGroup, exercise, reps, series, workType: descanso, notes: notesParts.join(' — ')
    });
  });
  return days.map(d=>({
    title: d.day ? toTitleCase(d.day) : 'Musculación importada',
    muscDay: d.day,
    muscBlocks: d.exercises
  }));
}

/* Interpreta una planilla de FUNCIONAL: cada fila es un ejercicio con su Día.
   Se agrupan por Día -- cada día se convierte en una planificación separada,
   con la Entrada en calor (tomada de la primera fila que la tenga) una sola vez
   y cada ejercicio como un bloque dentro de ella. */
/* DÍA se mantiene (arrastrado) hasta que aparece otro, formando una planificación por día.
   Dentro de un día, cada valor en BLOQUE DE TRABAJO abre un bloque nuevo que se mantiene
   hasta el próximo bloque (o el próximo día): SERIES, TIEMPO DE TRABAJO y los descansos se
   toman solo de esa fila; cada fila siguiente que tenga algo en EJERCICIOS se suma a la lista
   de ejercicios de ese mismo bloque. */
function parseFuncionalImportRows(rawRows){
  const days = [];
  let currentDay = null;
  let currentBlock = null;
  rawRows.forEach(row=>{
    const dayVal = getField(row,'DIA').toString().trim();
    const warmupVal = getField(row,'ENTRADA EN CALOR').toString().trim();
    const bloqueVal = getField(row,'BLOQUE DE TRABAJO').toString().trim();
    const seriesVal = getField(row,'SERIES').toString().trim();
    const exerciseVal = getField(row,'EJERCICIOS','EJERCICIO').toString().trim();
    const workTimeVal = getField(row,'TIEMPO DE TRABAJO').toString().trim();
    const restExVal = getField(row,'DESCANSO ENTRE EJERCICIOS').toString().trim();
    const restSeriesVal = getField(row,'DESCANSO ENTRE SERIES').toString().trim();

    if(!dayVal && !warmupVal && !bloqueVal && !seriesVal && !exerciseVal && !workTimeVal && !restExVal && !restSeriesVal) return;

    if(dayVal){
      currentDay = {day:dayVal, warmup:'', blocks:[]};
      days.push(currentDay);
      currentBlock = null;
    }
    if(!currentDay) return;
    if(warmupVal && !currentDay.warmup) currentDay.warmup = warmupVal;

    if(bloqueVal){
      currentBlock = {series:seriesVal, workTime:workTimeVal, restBetweenExercises:restExVal, restBetweenSeries:restSeriesVal, exercises:[]};
      currentDay.blocks.push(currentBlock);
      if(exerciseVal) currentBlock.exercises.push(exerciseVal);
    } else if(currentBlock && exerciseVal){
      currentBlock.exercises.push(exerciseVal);
    }
  });
  return days.map(d=>({
    title: d.day ? toTitleCase(d.day) : 'Entrenamiento funcional importado',
    funcDay: d.day,
    funcWarmup: d.warmup,
    funcBlocks: d.blocks
  }));
}

function formatExpiryLabel(payment){

/* ---- Structured step list (Garmin-style): E/C, cada bloque de pasadas o fondo/otro, V/C ---- */
function normalizedPasadasBlocks(w){
  if(w.pasadasBlocks && w.pasadasBlocks.length) return w.pasadasBlocks;
  if(w.pasadasReps || w.pasadasDist || w.pasadasPause) return [{reps:w.pasadasReps, dist:w.pasadasDist, pause:w.pasadasPause}];
  return [];
}
function normalizedFuncBlocks(w){
  if(w.funcBlocks && w.funcBlocks.length){
    return w.funcBlocks.map(b=>{
      if(b.exercises) return b;
      if(b.exercise) return {series:b.series, workTime:b.workTime, restBetweenExercises:b.restBetweenExercises, restBetweenSeries:b.restBetweenSeries, exercises:[b.exercise]};
      return Object.assign({exercises:[]}, b);
    });
  }
  return [];
}
function renderWorkoutSteps(w){
  const rows = [];
  if(w.warmup) rows.push(['E/C', w.warmup, 'step-warmup']);
  if(w.mainType==='fondo'){
    if(w.fondoDetail) rows.push(['FONDO', w.fondoDetail, '']);
  } else if(w.mainType==='otro'){
    if(w.otroDetail) rows.push(['TRABAJO', w.otroDetail, '']);
  } else {
    const blocks = normalizedPasadasBlocks(w).filter(b=>b.reps||b.dist||b.pause);
    blocks.forEach((b,i)=>{
      let text = `${b.reps||'—'} x ${b.dist||'—'}`;
      if(b.pause) text += ` — pausa de ${b.pause}`;
      rows.push([blocks.length>1?`REP ${i+1}`:'PASADAS', text, '']);
    });
  }
  if(w.cooldown) rows.push(['V/C', w.cooldown, 'step-cooldown']);
  if(rows.length===0) return '';
  return `<div class="step-list">${rows.map(([tag,text,cls])=>`<div class="step-row ${cls}"><span class="step-tag">${esc(tag)}</span><span class="step-text">${esc(text)}</span></div>`).join('')}</div>`;
}
function renderFuncionalDetail(w){
  const blocks = normalizedFuncBlocks(w).filter(b=>(b.exercises&&b.exercises.length)||b.workTime||b.series);
  if(blocks.length===0 && !w.funcWarmup && !w.funcDay) return '';
  const topRows = [];
  if(w.funcDay) topRows.push(`<div class="step-row step-warmup"><span class="step-tag">DÍA</span><span class="step-text">${esc(w.funcDay)}</span></div>`);
  if(w.funcWarmup) topRows.push(`<div class="step-row step-warmup"><span class="step-tag">E/C</span><span class="step-text">${esc(w.funcWarmup)}</span></div>`);
  return `<div class="step-list">${topRows.join('')}${blocks.map((b,i)=>`
    <div class="step-row" style="align-items:flex-start;flex-direction:column;gap:3px;">
      <div><span class="step-tag">BLOQUE ${i+1}</span> <b class="step-text">${esc((b.exercises||[]).join(', '))||'—'}</b></div>
      <div class="step-text" style="font-weight:400;">
        Series: ${esc(b.series)||'—'} · Trabajo: ${esc(b.workTime)||'—'}${b.restBetweenExercises?` · Desc. entre ejercicios: ${esc(b.restBetweenExercises)}`:''}${b.restBetweenSeries?` · Desc. entre series: ${esc(b.restBetweenSeries)}`:''}
      </div>
    </div>`).join('')}</div>`;
}
function renderMusculacionDetail(w){
  const items = (w.muscBlocks||[]).filter(b=>b.exercise);
  if(items.length===0 && !w.muscDay) return '';
  const dayRow = w.muscDay ? `<div class="step-row step-warmup"><span class="step-tag">DÍA</span><span class="step-text">${esc(w.muscDay)}</span></div>` : '';
  const groups = [];
  items.forEach(it=>{
    const last = groups[groups.length-1];
    if(last && last.muscleGroup===(it.muscleGroup||'')) last.exercises.push(it);
    else groups.push({muscleGroup: it.muscleGroup||'', exercises:[it]});
  });
  const groupRows = groups.map(g=>`
    <div class="step-row" style="align-items:flex-start;flex-direction:column;gap:6px;">
      <span class="step-tag">${esc(g.muscleGroup)||'GRUPO MUSCULAR'}</span>
      ${g.exercises.map(e=>`
        <div style="padding-left:2px;width:100%;">
          <b class="step-text">${esc(e.exercise)}</b>
          <div class="log-detail" style="margin-top:2px;">
            ${e.series?`<b>Series:</b> ${esc(e.series)} `:''}${e.reps?`<b>Reps:</b> ${esc(e.reps)} `:''}${e.workType?`<b>Descanso:</b> ${esc(e.workType)}`:''}
            ${e.notes?`<br>${esc(e.notes)}`:''}
          </div>
        </div>`).join('')}
    </div>`).join('');
  return `<div class="step-list">${dayRow}${groupRows}</div>`;
}
/* Dispatcher: elige cómo mostrar la planificación según su categoría (running / funcional / musculación) */
function renderPlanDetail(w){
  const category = w.category || 'running';
  if(category==='funcional') return renderFuncionalDetail(w);
  if(category==='musculacion') return renderMusculacionDetail(w);
  return renderWorkoutSteps(w);
}

function render(){
  const app = document.getElementById('app');
  if(!dbLoaded){ app.innerHTML = `<div class="loading-txt">Cargando Koro Team...</div>`; return; }
  if(dbLoadFailed){
    app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card" style="text-align:center;max-width:460px;">
        <div class="auth-logo"><div class="logo-text">KORO<span>TEAM</span></div></div>
        <h3 style="margin:16px 0 8px 0;">No pudimos conectar con la base de datos</h3>
        <p style="color:var(--muted);font-size:13px;line-height:1.6;">Puede ser un problema de conexión a internet, o de la configuración de Firebase. Por seguridad, la app no muestra nada hasta poder confirmar que está viendo tus datos reales — así evitamos el riesgo de que algo se guarde por error como si estuviera todo vacío.</p>
        <button class="btn-secondary" id="retryLoadBtn" style="margin-top:14px;">Volver a intentar</button>
      </div>
    </div>`;
    const retryBtn = document.getElementById('retryLoadBtn');
    if(retryBtn) retryBtn.onclick = async ()=>{
      dbLoaded = false; dbLoadFailed = false;
      render();
      await loadDB();
      render();
    };
    return;
  }
  try{
    if(S.screen === 'login') app.innerHTML = renderLogin();
    else if(S.screen === 'register') app.innerHTML = renderRegister();
    else if(S.screen === 'pending') app.innerHTML = renderPending();
    else if(S.screen === 'app') app.innerHTML = renderAppShell();
    attachHandlers();
    const chatBody = document.getElementById('chatBody');
    if(chatBody) chatBody.scrollTop = chatBody.scrollHeight;
  }catch(err){
    showCrashScreen(err);
  }
}

/* ===================== NOTICES BANNER ===================== */
function studentPaymentsNearExpiry(username){
  const now = Date.now();
  const expiryMs = SUBSCRIPTION_VALID_DAYS*24*60*60*1000;
  const weekMs = 7*24*60*60*1000;
  const latestByPlan = {};
  Object.values(db.payments).forEach(p=>{
    if(p.username!==username || p.status!=='confirmed' || !p.confirmedAt) return;
    const existing = latestByPlan[p.planId];
    if(!existing || p.confirmedAt > existing.confirmedAt) latestByPlan[p.planId] = p;
  });
  return Object.values(latestByPlan)
    .map(p=>({payment:p, expiresAt: p.confirmedAt + expiryMs}))
    .filter(x=> x.expiresAt - now > 0 && x.expiresAt - now <= weekMs);
}

function renderNotices(){
  if(S.bannerDismissed) return '';
  const u = me();
  const notices = [];
  if(u.role==='admin'){
    const unread = unreadMessagesForAdmin();
    if(unread>0) notices.push({text:`Tenés ${unread} mensaje${unread>1?'s':''} nuevo${unread>1?'s':''} de alumnos.`, nav:'messages'});
    const pend = pendingPaymentsCount();
    if(pend>0) notices.push({text:`${pend} alumno${pend>1?'s':''} notificó un pago para revisar.`, nav:'payments'});
    const pendApp = pendingApprovalsCount();
    if(pendApp>0) notices.push({text:`${pendApp} cuenta${pendApp>1?'s':''} esperando aprobación.`, nav:'approvals'});
  } else {
    const unread = unreadMessagesForStudent(S.currentUser);
    if(unread>0) notices.push({text:`Tu coach te escribió ${unread>1?`${unread} mensajes nuevos`:'un mensaje nuevo'}.`, nav:'messages'});
    if(!u.ficha || !u.ficha.completed) notices.push({text:'No completaste tu ficha personal. Cargala para que tu coach tenga tus datos.', nav:'ficha'});
    studentPaymentsNearExpiry(S.currentUser).forEach(({payment, expiresAt})=>{
      const plan = db.paymentPlans[payment.planId];
      const planName = plan ? plan.name : 'tu abono';
      const daysLeft = Math.max(1, Math.ceil((expiresAt - Date.now()) / (24*60*60*1000)));
      const d = new Date(expiresAt);
      const dstr = dateStr(d.getFullYear(), d.getMonth(), d.getDate());
      const when = daysLeft>=6 ? 'en una semana' : (daysLeft===1 ? 'mañana' : `en ${daysLeft} días`);
      notices.push({text:`${when.charAt(0).toUpperCase()+when.slice(1)} se vence tu suscripción al abono "${planName}" (${formatDateLong(dstr)}). Notificá tu próximo pago para no perder el acceso.`, nav:'payments'});
    });
  }
  if(notices.length===0) return '';
  return `<div class="notice-banner-wrap">${notices.map((n,i)=>`
    <div class="notice-banner" data-notice-nav="${n.nav}">
      <span>${esc(n.text)}</span>
      <button type="button" class="notice-x" data-notice-close="${i}">✕</button>
    </div>`).join('')}</div>`;
}

      msgs.map(([id,m])=>{

function renderStudentMain(){
  if(S.studentTab==='workouts') return renderStudentWorkouts();
  if(S.studentTab==='races') return renderStudentRaces();
  if(S.studentTab==='achievements') return renderStudentAchievements();

function myWorkoutEntries(){
  const myGroup = me() ? me().group : null;
  const myDisciplines = studentDisciplines(S.currentUser);
  return Object.entries(db.workouts).filter(([id,w]) =>
    myDisciplines.has(w.category) && (
      w.type==='general' ||
      (w.type==='individual' && w.assignedTo === S.currentUser) ||
      (w.type==='grupo' && myGroup && w.assignedGroup === myGroup)
    )
  );
}

/* ---- Calendario de entrenamientos (alumno): requiere suscripción + pago del mes ---- */
function renderStudentWorkouts(){
  const mySubs = studentSubscribedPlans(S.currentUser);
  if(mySubs.length===0){
    return `
    <h1 class="page-title">Calendario de entrenamientos</h1>
    <div class="paywall">
      ${boltSVG('#F7B500')}
      <h3 style="margin:16px 0 8px 0;">Todavía no tenés ninguna suscripción activa</h3>
      <p style="color:var(--muted);font-size:13px;max-width:420px;margin:0 auto 20px auto;">Elegí a qué abono suscribirte desde "Pagos - Mensualidades" para empezar a ver tus planificaciones.</p>
      <button class="btn-sm" data-notice-nav="payments">Ir a Pagos</button>
    </div>
    `;
  }
  if(!studentHasPaidCurrentMonth(S.currentUser)){
    const alreadyNotified = studentHasNotifiedCurrentMonth(S.currentUser);
    if(alreadyNotified){
      return `
      <h1 class="page-title">Calendario de entrenamientos</h1>
      <div class="paywall">
        ${boltSVG('#F7B500')}
        <h3 style="margin:16px 0 8px 0;">Tu pago está pendiente de confirmación</h3>
        <p style="color:var(--muted);font-size:13px;max-width:420px;margin:0 auto 20px auto;">Ya notificaste tu pago de este mes. En cuanto tu coach lo confirme, vas a poder ver tus entrenamientos acá.</p>
      </div>
      `;
    }
    return `
    <h1 class="page-title">Calendario de entrenamientos</h1>
    <div class="paywall">
      ${boltSVG('#F7B500')}
      <h3 style="margin:16px 0 8px 0;">Todavía no notificaste tu pago de este mes</h3>
      <p style="color:var(--muted);font-size:13px;max-width:420px;margin:0 auto 20px auto;">Para ver tus entrenamientos anteriores y los que vienen, notificá tu pago de la mensualidad. Una vez confirmado por tu coach, tenés acceso por 30 días.</p>
      ${mySubs.map(([id,p])=>`
        <div class="plan-card">
          <div class="card-row">
            <div>
              <h3 style="margin:0 0 2px 0;font-size:15px;">${esc(p.name)}</h3>
              <div class="plan-amount">$${esc(p.amount)}<span style="font-size:11px;color:var(--muted);font-weight:600;"> / mes</span></div>
              ${p.description ? `<div class="log-detail">${esc(p.description)}</div>` : ''}
            </div>
          </div>
        </div>`).join('')}
      <button class="btn-sm" id="notifyPaymentBtn" style="margin-top:10px;">Notificar pago</button>
    </div>
    `;
  }
  const mine = myWorkoutEntries();
  const markedDates = new Set(mine.map(([id,w])=>w.date).filter(Boolean));
  const dayWorkouts = mine.filter(([id,w])=>w.date===S.calSelectedDate);
  return `
  <h1 class="page-title">Calendario de entrenamientos</h1>
  <p class="page-sub">Cada planificación que te asignó tu coach, en la fecha que corresponda.</p>
  <div class="cal-layout">
    ${renderMonthCalendar(markedDates)}
    <div class="cal-details">
      <h3 class="selected-day-label" style="margin-bottom:14px;">${formatDateLong(S.calSelectedDate)}</h3>
      ${dayWorkouts.length===0 ? `<div class="empty-state">${boltSVG('#3a3a3a')}<p>No tenés ningún entrenamiento asignado este día.</p></div>` :
      dayWorkouts.map(([id,w])=>{
        const myLog = Object.entries(db.logs).find(([lid,l])=>l.workoutId===id && l.username===S.currentUser);
        return workoutCardHTML(id, w, {
          actionsHTML: myLog ? `<span class="tag tag-active">Registrado</span>` : `<button class="btn-sm" data-log-workout="${id}">Registrar</button>`,
          extraHTML: myLog ? `${logDetailHTML(myLog[1])}
            ${myLog[1].adminComment ? `<div class="comment-box"><b>Comentario del coach:</b> ${esc(myLog[1].adminComment)}</div>` : ''}` : ''
        });
      }).join('')}
    </div>
  </div>
  `;
}

  const mainType = fv('mainType','pasadas');

function musculacionFieldsHTML(prefix, w, draft){

function planFieldsHTML(prefix, entity, draft, category){
  const specific = category==='funcional' ? funcionalFieldsHTML(prefix, entity, draft)
    : category==='musculacion' ? musculacionFieldsHTML(prefix, entity, draft)
    : runningFieldsHTML(prefix, entity, draft);
  const desc = (draft && draft.description!==undefined) ? draft.description : (entity && entity.description!==undefined ? entity.description : '');
  return `

  <div class="subsection-label">Descripción</div>
  <div class="field"><textarea id="${prefix}Desc" rows="3" placeholder="Notas adicionales, aclaraciones, objetivo del día...">${esc(desc)}</textarea></div>

}

/* Reads every current field of the entrenamiento form (prefix 'w' or 't') into a draft object,
   so nothing typed gets lost when adding/removing a pasadas distance row and the modal re-renders. */
function captureDraftFromForm(prefix){
  const draft = {};
  draft.title = getVal(prefix+'Title');
  if(prefix==='w'){
    draft.date = getVal('wDate');
    draft.type = getVal('wType');
    draft.assignedTo = document.getElementById('wStudent') ? getVal('wStudent') : '';
    draft.assignedGroup = document.getElementById('wGroup') ? getVal('wGroup') : '';
  }
  if(prefix==='t'){
    draft.folderId = getVal('tFolder');
  }
  // Running
  draft.warmup = getVal(prefix+'Warmup');
  draft.mainType = getVal(prefix+'MainType');
  draft.fondoDetail = getVal(prefix+'FondoDetail');
  draft.otroDetail = getVal(prefix+'OtroDetail');
  draft.cooldown = getVal(prefix+'Cooldown');
  draft.description = getVal(prefix+'Desc');
  const container = document.getElementById(prefix+'BlocksContainer');
  const count = container ? parseInt(container.getAttribute('data-count'),10) || 1 : 1;
  const blocks = [];
  for(let i=0;i<count;i++){
    blocks.push({ reps:getVal(prefix+'BlockReps'+i), dist:getVal(prefix+'BlockDist'+i), pause:getVal(prefix+'BlockPause'+i) });
  }
  draft.pasadasBlocks = blocks;
  // Día de trabajo (compartido por Funcional y Musculación)
  draft.planDay = getVal(prefix+'PlanDay');
  // Funcional
  draft.funcWarmup = getVal(prefix+'FuncWarmup');
  const funcContainer = document.getElementById(prefix+'FuncBlocksContainer');
  const funcCount = funcContainer ? parseInt(funcContainer.getAttribute('data-count'),10) || 1 : 0;
  const funcBlocks = [];
  for(let i=0;i<funcCount;i++){
    funcBlocks.push({
      series:getVal(prefix+'FuncBlockSeries'+i), workTime:getVal(prefix+'FuncBlockWorkTime'+i),
      restBetweenExercises:getVal(prefix+'FuncBlockRestEx'+i), restBetweenSeries:getVal(prefix+'FuncBlockRestSeries'+i),
      exercisesText: getVal(prefix+'FuncBlockExercises'+i)
    });
  }
  draft.funcBlocks = funcBlocks;
  // Musculación
  const muscContainer = document.getElementById(prefix+'MuscBlocksContainer');
  const muscCount = muscContainer ? parseInt(muscContainer.getAttribute('data-count'),10) || 1 : 0;
  const muscBlocks = [];
  for(let i=0;i<muscCount;i++){
    muscBlocks.push({
      muscleGroup:getVal(prefix+'MuscGroup'+i),
      exercise:getVal(prefix+'MuscExercise'+i), reps:getVal(prefix+'MuscReps'+i),
      series:getVal(prefix+'MuscSeries'+i), workType:getVal(prefix+'MuscWorkType'+i), notes:getVal(prefix+'MuscNotes'+i)
    });
  }
  draft.muscBlocks = muscBlocks;
  return draft;
}

/* Arma los campos propios de cada categoría a partir del draft capturado del formulario. */
function buildPlanFields(category, data){
  if(category==='funcional'){
    return {
      funcDay: data.planDay.trim(),
      funcWarmup: data.funcWarmup.trim(),
      funcBlocks: (data.funcBlocks||[]).map(b=>({
        series:b.series.trim(), workTime:b.workTime.trim(), restBetweenExercises:b.restBetweenExercises.trim(),
        restBetweenSeries:b.restBetweenSeries.trim(),
        exercises: b.exercisesText.split('\n').map(s=>s.trim()).filter(Boolean)
      }))
    };
  }
  if(category==='musculacion'){
    return {
      muscDay: data.planDay.trim(),
      muscBlocks: (data.muscBlocks||[]).map(b=>({
        muscleGroup:b.muscleGroup.trim(), exercise:b.exercise.trim(), reps:b.reps.trim(), series:b.series.trim(), workType:b.workType.trim(), notes:b.notes.trim()
      }))
    };
  }
  return {
    warmup: data.warmup.trim(),
    mainType: data.mainType,
    pasadasBlocks: (data.pasadasBlocks||[]).map(b=>({reps:b.reps.trim(), dist:b.dist.trim(), pause:b.pause.trim()})),
    fondoDetail: data.fondoDetail.trim(),
    otroDetail: data.otroDetail.trim(),
    cooldown: data.cooldown.trim()
  };
}

function attachHandlers(){
  // ---- LOGIN ----
  const loginForm = document.getElementById('loginForm');
  if(loginForm){
    loginForm.onsubmit = (e)=>{
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const u = db.users[username];
      if(!u || u.password !== pass){ S.error='Usuario o contraseña incorrectos.'; render(); return; }
      if(u.status==='pending'){ S.currentUser=username; S.error=''; S.screen='pending'; render(); return; }
      S.currentUser = username; S.error=''; S.screen='app'; S.bannerDismissed=false; render();
    };
  }
  const goRegister = document.getElementById('goRegister');
  if(goRegister) goRegister.onclick = ()=>{ S.screen='register'; S.error=''; render(); };
  const goLogin = document.getElementById('goLogin');
  if(goLogin) goLogin.onclick = ()=>{ S.screen='login'; S.error=''; render(); };
  const backToLogin = document.getElementById('backToLogin');
  if(backToLogin) backToLogin.onclick = ()=>{ S.screen='login'; S.currentUser=null; render(); };

  // ---- REGISTER ----
  const registerForm = document.getElementById('registerForm');
  if(registerForm){
    registerForm.onsubmit = async (e)=>{
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value;
      if(!name || !email || !username || !pass) return;
      if(db.users[username]){ S.error='Ese usuario ya existe.'; render(); return; }
      db.users[username] = {
        password:pass, role:'student', status:'pending', name, email, studentType:null,
        group: null, subscribedPlanIds:[],
        ficha: {email, completed:false},
        createdAt:Date.now()
      };
      await saveDB();
      S.currentUser = username; S.error=''; S.screen='pending'; render();
    };
  }

  // ---- LOGOUT ----
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{ S.currentUser=null; S.screen='login'; S.error=''; S.messagesActiveStudent=null; S.adminTab='plan'; S.fichaTemp=null; S.fichaEditMode=false; S.templateSelectMode=false; S.selectedTemplateIds=[]; render(); };

  // ---- NOTICES ----
  document.querySelectorAll('[data-notice-close]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); S.bannerDismissed=true; render(); };
  });
  document.querySelectorAll('[data-notice-nav]').forEach(el=>{
    el.onclick = ()=>{
      const val = el.getAttribute('data-notice-nav');
      S.bannerDismissed = true;
      if(me().role==='admin') S.adminTab = val; else S.studentTab = val;
      if(val==='messages'){
        if(me().role==='student') markMessagesRead(S.currentUser,'student');
      }
      render();
    };
  });

  // ---- NAV ----
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const val = el.getAttribute('data-nav');
      if(me().role==='admin'){
        S.adminTab = val;
        if(val==='messages') S.messagesActiveStudent = null;
      } else {
        S.studentTab = val;
        if(val==='messages') markMessagesRead(S.currentUser,'student');
        if(val==='ficha') initFichaTemp();
      }
      render();
    };
  });

  // ---- CALENDAR NAV (shared) ----
  document.querySelectorAll('[data-cal-prev]').forEach(el=>{
    el.onclick = ()=>{ S.calMonth--; if(S.calMonth<0){ S.calMonth=11; S.calYear--; } render(); };
  });
  document.querySelectorAll('[data-cal-next]').forEach(el=>{
    el.onclick = ()=>{ S.calMonth++; if(S.calMonth>11){ S.calMonth=0; S.calYear++; } render(); };
  });
  document.querySelectorAll('[data-cal-day]').forEach(el=>{
    el.onclick = ()=>{ S.calSelectedDate = el.getAttribute('data-cal-day'); render(); };
  });

  // ---- ADMIN: workout create/edit ----

  //      (por ejemplo, el panel de artifacts de Claude): en vez de depender del evento
  //      "submit" del navegador, el botón dispara directamente el mismo handler ya
  //      asignado a form.onsubmit. preventDefault() en el click evita que además se
  //      dispare el submit nativo (que ejecutaría el handler una segunda vez).
  //      También evita doble clic: el botón se desactiva apenas se toca, así que si
  //      alguien lo toca dos veces rápido (por ejemplo mientras se guarda en Firebase),
  //      la segunda vez no hace nada. Se vuelve a habilitar solo en el próximo render. ----
  document.querySelectorAll('form').forEach(form=>{
    if(typeof form.onsubmit !== 'function') return;
    const submitBtn = form.querySelector('button[type="submit"]');
    if(!submitBtn) return;
    const handler = form.onsubmit;
    submitBtn.addEventListener('click', function(e){
      e.preventDefault();
      if(submitBtn.disabled) return;
      submitBtn.disabled = true;
      const result = handler.call(form, {preventDefault:function(){}, target:form});
      if(result && typeof result.finally === 'function'){
        result.finally(()=>{ submitBtn.disabled = false; });
      } else {
        submitBtn.disabled = false;
      }
    });
  });
}

/* ===================== INIT ===================== */
/* Refresco automático: cada 20 segundos, si estamos adentro de la app, no hay ningún
   formulario/modal abierto, y nadie está en ese momento escribiendo en un campo de
   texto (en cualquier pantalla), traemos la versión más fresca de Firestore y volvemos
   a dibujar la pantalla. También salteamos el refresco por completo mientras el alumno
   está en "Mi ficha", porque es una carga larga de datos y conviene no interrumpirla
   nunca, aunque en ese momento no tenga el foco puesto en ningún campo. */
async function refreshDbFromRemote(){
  try{
    const docSnap = await firestore.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC).get();
    if(docSnap.exists && docSnap.data() && docSnap.data().payload){
      db = JSON.parse(docSnap.data().payload);
    }
  }catch(e){ console.error('No se pudo refrescar desde Firestore', e); }
}
setInterval(async ()=>{
  if(!dbLoaded || S.screen!=='app' || S.modal) return;
  if(S.studentTab==='ficha') return;
  const activeEl = document.activeElement;
  const isTyping = activeEl && (activeEl.tagName==='INPUT' || activeEl.tagName==='TEXTAREA' || activeEl.isContentEditable);
  if(isTyping) return;
  await refreshDbFromRemote();
  render();
}, 20000);

(async function init(){
  render();
  await loadDB();
  render();
})();
</script>
